name: CI

# Run on every push to main and on every PR targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out the repo.
      - uses: actions/checkout@v4

      # 2) Install uv (and cache its downloads to speed up future runs).
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 3) Provision the exact Python the project pins.
      - name: Set up Python 3.12
        run: uv python install 3.12

      # 4) Install the project + dev deps (pytest) from the locked versions.
      #    --frozen fails if uv.lock is out of date, so CI catches a stale lock.
      - name: Install dependencies
        run: uv sync --python 3.12 --frozen

      # 5) Run the suite. No ANTHROPIC_API_KEY needed: the tests mock the LLM.
      #    A green run here with zero secrets is the proof the test strategy is sound.
      - name: Run tests
        run: uv run --python 3.12 pytest
